<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>histgraph — 조선</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="mark"></span>
    <h1>histgraph</h1>
    <button class="era" id="go-root" title="이 그래프의 중심으로">조선</button>
  </div>

  <div class="search">
    <input id="q" type="search" placeholder="인물·사건·장소 검색   (예: 세종, 임진왜란, 이순신)"
           autocomplete="off" spellcheck="false">
    <ul id="results" class="results" hidden></ul>
  </div>

  <div class="counts" id="counts"></div>
</header>

<div class="layout">
  <aside class="side">
    <section>
      <h2>시작점</h2>
      <p class="hint">가장 많이 연결된 개체부터. 클릭하면 그 주변을 펼칩니다.</p>
      <ul id="seeds" class="seeds"></ul>
    </section>

    <section>
      <h2>범례</h2>
      <ul class="legend" id="legend"></ul>
      <ul class="legend lines">
        <li><svg width="26" height="10"><line x1="1" y1="5" x2="25" y2="5" stroke="rgba(198,196,186,.6)" stroke-width="1.4"/></svg><span>구조화 소스 (확실)</span></li>
        <li><svg width="26" height="10"><line x1="1" y1="5" x2="25" y2="5" stroke="rgba(198,196,186,.6)" stroke-width="1.4" stroke-dasharray="5 4"/></svg><span>산문에서 추출 (근거 있음)</span></li>
        <li><svg width="26" height="10"><line x1="1" y1="5" x2="25" y2="5" stroke="rgba(198,196,186,.6)" stroke-width="1.4" stroke-dasharray="2 4"/></svg><span>동일 실체 (same_as)</span></li>
      </ul>
    </section>

    <section>
      <h2>표시</h2>
      <label class="row"><span>펼침 깊이</span>
        <select id="depth">
          <option value="1">1단계</option>
          <option value="2" selected>2단계</option>
        </select>
      </label>
      <label class="row"><span>최대 노드</span>
        <select id="limit">
          <option value="60">60</option>
          <option value="120" selected>120</option>
          <option value="220">220</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="show-period"> 연도·시대 노드 포함</label>
      <label class="check"><input type="checkbox" id="show-labels" checked> 이름표 보이기</label>
      <p class="hint">노드 클릭 = 상세 + 주변 펼치기 · 드래그 = 고정 · 휠 = 확대</p>
    </section>
  </aside>

  <main class="stage">
    <canvas id="canvas"></canvas>
    <div class="stage-note" id="note" hidden></div>
    <div class="empty" id="empty">
      <p>왼쪽에서 시작점을 고르거나 위에서 검색하세요.</p>
    </div>
  </main>

  <aside class="detail" id="detail" hidden>
    <button class="close" id="detail-close" aria-label="닫기">✕</button>
    <div id="detail-body"></div>
  </aside>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
